name: Build, cek CSS & QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      # Pastikan css/style.css tidak ketinggalan setelah SCSS berubah.
      - name: Cek css/style.css sinkron dengan scss/
        run: npm run check

  lint-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      # Struktur HTML valid (aturan gaya di .htmlvalidate.json).
      - name: Validasi HTML
        run: npm run lint:html

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      # Chrome sudah tersedia di runner; QA 6 viewport + reduced-motion
      # + FPS (informatif) + uji parallax.
      - name: Jalankan QA visual & parallax
        run: npm test
